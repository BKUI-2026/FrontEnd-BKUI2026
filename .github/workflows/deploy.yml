name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "markdowns-fe/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-produksi
  cancel-in-progress: false

env:
  SERVER: ubuntu@43.173.14.84
  TUJUAN: /opt/bkui-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" || { echo "Secret VPS_SSH_KEY / VPS_KNOWN_HOSTS belum diisi"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$SERVER" true

      - name: Kirim kode
        run: |
          ssh -o BatchMode=yes "$SERVER" "sudo mkdir -p $TUJUAN && sudo chown \$(id -u):\$(id -g) $TUJUAN"
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .github \
            --exclude .next \
            --exclude '.env*' \
            --exclude '*.tsbuildinfo' \
            ./ "$SERVER:$TUJUAN/"

      - name: Build & jalankan di VPS
        run: ssh -o BatchMode=yes "$SERVER" "sudo bash $TUJUAN/scripts/cd-remote.sh"

      - name: Cek dari luar
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null https://uibedahkampus.com; then
              echo "Web sehat"; exit 0
            fi
            sleep 5
          done
          echo "Web tidak sehat dari luar"; exit 1
